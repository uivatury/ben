[models]
name = GIB-BBO API Server (Minimal Search)
model_version = 3
n_cards_bidding = 24
n_cards_play = 32
tf_version = 2
NS = 1
EW = 1
use_bba = False
consult_bba = False
use_bba_rollout = False
use_bba_to_count_aces = False
